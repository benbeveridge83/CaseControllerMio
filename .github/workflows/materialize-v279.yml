name: Materialize and verify withdrawal workspace
on:
  push:
    branches: [feature/drafting-withdrawal-20260905]
    paths: ['.github/mio-v279-part*.txt', '.github/workflows/materialize-v279.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and commit the reviewed source bundle to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,gzip,base64,hashlib,pathlib,urllib.request
          paths=['src/mioWithdrawalWorkflow.js','src/mioWithdrawalRepository.js','src/mioWithdrawalRuntime.js','src/MioWithdrawalDashboard.jsx','src/mioWithdrawalDashboard.css','src/mioWithdrawalAppAdapters.inc','mio-v279-withdrawal-dashboard.js','vite.config.js','supabase/migrations/20260905160000_withdrawal_workflows_v1.sql','tests/transform-all.mjs','tests/withdrawal-workflow.test.js','tests/drafting-withdrawal-browser.mjs']
          parts=[f'.github/mio-v279-part{i}.txt' for i in range(1,6)]
          raw=gzip.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='4ee827332b55c18a93205f2257e1b686d98dd6d776d12253970c5ea703b3c2e1','Source bundle hash mismatch'
          files=json.loads(raw)
          assert set(files)==set(paths),'Unexpected source paths'
          for p,text in files.items():
            assert isinstance(text,str)
            pathlib.Path(p).parent.mkdir(parents=True,exist_ok=True)
            pathlib.Path(p).write_text(text,encoding='utf8')
          def request(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode()
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,data=data,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=40) as response:return json.load(response)
          ref='heads/feature/drafting-withdrawal-20260905'
          sha=request('GET','git/ref/'+ref)['object']['sha']
          assert sha==os.environ['GITHUB_SHA'],'Feature branch changed; refusing to overwrite'
          tree=request('GET','git/commits/'+sha)['tree']['sha']
          entries=[{'path':p,'mode':'100644','type':'blob','content':text} for p,text in files.items()]
          entries += [{'path':p,'mode':'100644','type':'blob','sha':None} for p in parts]
          newtree=request('POST','git/trees',{'base_tree':tree,'tree':entries})['sha']
          commit=request('POST','git/commits',{'message':'Step 2: action-first withdrawal workflow and module handoffs','tree':newtree,'parents':[sha]})['sha']
          request('PATCH','git/refs/'+ref,{'sha':commit,'force':False})
          for p in parts:pathlib.Path(p).unlink()
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/source-commit.txt').write_text(commit)
          print('Materialized source commit:',commit)
          PY
      - name: Capture source
        if: always()
        run: |
          mkdir -p test-results
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude='.env*' -czf test-results/source.tar.gz .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
      - run: npm install --no-save jszip@3.10.1
      - run: npx playwright-core install --with-deps chromium
      - name: Browser smoke and workflow checks using synthetic data only
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mio-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/cloud-browser.mjs
          node tests/drafting-withdrawal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mio-v279-validation
          retention-days: 3
          path: test-results
