name: Party pronouns and adaptive captions
on:
  push:
    branches: [fix/party-pronouns-captions-302, main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending V302 source patches
        id: patches
        shell: bash
        run: |
          shopt -s nullglob
          patches=(.v302-patches/*.patch)
          if ((${#patches[@]})); then
            for patch in "${patches[@]}"; do
              echo "Checking $patch"
              git apply --check "$patch"
              git apply "$patch"
            done
            rm -rf .v302-patches
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit regressions
        run: node --test tests/*.test.js
      - name: Production build
        run: npm run build
      - name: Install test-only DOCX reader
        run: npm install --no-save --package-lock=false jszip@3.10.1
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser and generated Word checks
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mio-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/cloud-startup-browser.mjs
          node tests/drafting-safe-browser.mjs
          if test -f tests/pronouns-captions-browser.mjs; then node tests/pronouns-captions-browser.mjs; fi
      - name: Commit only the source that passed every gate
        if: steps.patches.outputs.applied == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/fix/party-pronouns-captions-302'
        run: |
          git config user.name "Mio Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "V302: party-linked pronouns and adaptive captions"
          git push origin HEAD:fix/party-pronouns-captions-302
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v302-verification
          retention-days: 3
          path: test-results
