name: Appointed billing vouchers
on:
  push:
    branches: [feature/appointed-vouchers, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-appointed-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Appointment selection, invoice arithmetic, voucher PDFs and AI boundaries
        run: node --test tests/appointed-*.test.js
      - name: Build production Mio
        run: npm run build
      - name: Full three-step billing flow using synthetic records
        run: |
          export MIO_TEST_CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$MIO_TEST_CHROMIUM_PATH"
          node tests/appointed-billing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appointed-billing-verification
          path: test-results
          retention-days: 7
