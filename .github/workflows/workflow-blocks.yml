name: Workflow blocks verification
on:
  push:
    branches: [feature/workflow-blocks-v305]
  pull_request:
    branches: [main]
    paths: ['src/**','mio-v305-*','tests/**','vite.config.js','.github/workflows/workflow-blocks.yml']
permissions:
  contents: read
concurrency:
  group: workflow-blocks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
      - run: npm install --no-save jszip@3.10.1
      - name: Browser checks
        run: |
          mkdir -p test-results
          npx playwright-core install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > test-results/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          if [ -f tests/workflow-blocks-browser.mjs ]; then node tests/workflow-blocks-browser.mjs; else node tests/withdrawal-inline-browser.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-blocks-results
          retention-days: 3
          path: |
            test-results/*.png
            test-results/*.txt
            test-results/*.log
