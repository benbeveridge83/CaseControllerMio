name: Finance review and payment verification
on:
  push:
    branches: [fix/finance-review-payments-20260911, 'fix/lawpay-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: finance_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: finance_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify finance models and composed production callbacks
        run: timeout 120s node --test tests/finance-v314.test.js tests/lawpay-attribution.test.js tests/finance-v314-integration.test.js tests/daily-billing-finance-refresh.test.js tests/pnc-daily-trust.test.js tests/lawpay-classification-v323.test.js tests/lawpay-accounts-v323-shared.test.js tests/lawpay-provider-account-v324.test.js tests/lawpay-provider-account-migration-v324.test.js tests/lawpay-review-count.test.js tests/lawpay-review-gateway-v325.test.js tests/lawpay-review-ui-v325.test.js tests/lawpay-review-migration-v325.test.js
      - name: Test atomic SQL on isolated synthetic PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/finance-v314-schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260911210000_lawpay_atomic_reconciliation_v314.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/finance-v314-behavior.sql
          psql -v ON_ERROR_STOP=1 -c "select mio_store_lawpay_transaction_v314(fixture_row('concurrent-a',2,10000));" &
          first=$!
          psql -v ON_ERROR_STOP=1 -c "select mio_store_lawpay_transaction_v314(fixture_row('concurrent-b',2,10000));" &
          second=$!
          psql -v ON_ERROR_STOP=1 -c "select mio_store_lawpay_transaction_v314(fixture_row('concurrent-a',2,10000));" &
          third=$!
          wait "$first"
          wait "$second"
          wait "$third"
          psql -v ON_ERROR_STOP=1 -f tests/sql/finance-v314-concurrency.sql
      - name: Test LawPay classification posting, duplicates and corrections on the isolated PostgreSQL
        run: |
          # The job log of this step is only visible to repository administrators, so a failure is
          # reported through the step summary and error annotations as well. Both contain psql output
          # about synthetic fixtures only; anything resembling a credential or connection value is
          # redacted before it is published.
          set -o pipefail
          log="$(mktemp)"
          # Keep the redaction narrow: connection strings and credentials only, so the diagnostic
          # stays readable while no connection value or credential can be published.
          redact() {
            sed -E -e 's#postgres(ql)?://[^[:space:]]+#postgres://[redacted]#Ig' -e 's/(PGPASSWORD|password|passwd|pwd)=[^[:space:]]*/\1=[redacted]/Ig' -e 's/Bearer [A-Za-z0-9._-]+/Bearer [redacted]/Ig' -e 's/eyJ[A-Za-z0-9._-]{20,}/[redacted-jwt]/g'
          }
          summary() {
            {
              echo '### LawPay classification database suite failed'
              echo
              echo "Failing file: ${failing_file:-unknown}"
              echo
              echo '```'
              grep -n -i -E '(^|[^a-z])(error|detail|hint|context|fatal|exception|assert|expected)([^a-z]|$)' "$log" | tail -n 20 | redact
              echo '```'
              echo
              echo 'Last lines of output:'
              echo
              echo '```'
              tail -n 15 "$log" | redact
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # One precise annotation, because GitHub samples a long run of them unhelpfully.
            {
              echo "psql failed on ${failing_file:-an unknown file}. "
              grep -n -i -E '(^|[^a-z])(error|detail|hint|context|fatal|exception|assert|expected)([^a-z]|$)' "$log" | tail -n 8 | tr '\n' ' | '
              echo 'Last output: '
              tail -n 4 "$log" | tr '\n' ' | '
            } | redact | while IFS= read -r line; do echo "::error::${line}"; done
          }
          status=0
          # The isolated database must mirror the production grant defaults the verifier reasons
          # about: Supabase grants its server role access to the public schema, while anon and
          # authenticated are created without any grant so the verifier's denial checks stay
          # meaningful. Confirming the production grants themselves is what the verifier does when it
          # is run against production, which is where a "(stop)" on service_role would be acted on.
          psql -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists(select 1 from pg_roles where rolname = 'anon') then create role anon; end if; if not exists(select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if; if not exists(select 1 from pg_roles where rolname = 'service_role') then create role service_role; end if; end \$\$;" >> "$log" 2>&1 || { status=1; failing_file='fixture prerequisites (roles)'; }
          psql -v ON_ERROR_STOP=1 -c 'alter default privileges in schema public grant all on tables to service_role; alter default privileges in schema public grant all on sequences to service_role; alter default privileges in schema public grant execute on functions to service_role; grant all on all tables in schema public to service_role; grant all on all sequences in schema public to service_role; grant execute on all functions in schema public to service_role;' >> "$log" 2>&1 || { status=1; failing_file='fixture prerequisites (service_role grants)'; }
          for file in \
            tests/sql/lawpay-classification-v323-schema.sql \
            supabase/migrations/20260922090000_lawpay_classification_v323.sql \
            supabase/migrations/20260922090001_lawpay_refund_resolution_v323.sql \
            tests/sql/lawpay-classification-v323-behavior.sql \
            tests/sql/lawpay-refund-resolution-v323-behavior.sql \
              supabase/migrations/20260923090000_lawpay_provider_account_resolution_v324.sql \
              tests/sql/lawpay-provider-account-resolution-v324-behavior.sql \
              supabase/migrations/20260925150000_lawpay_review_queue_v325.sql \
              tests/sql/lawpay-review-queue-v325-behavior.sql \
              docs/lawpay-step2-verification-readonly.sql \
              docs/lawpay-step3-verification-readonly.sql \
              docs/lawpay-step6-verification-readonly.sql \
              docs/lawpay-step7-rollback-restore.sql \
              docs/lawpay-step4-verification-readonly.sql
          do
            echo "--- psql -v ON_ERROR_STOP=1 -f $file" | tee -a "$log"
            psql -v ON_ERROR_STOP=1 -f "$file" >> "$log" 2>&1 || { status=1; failing_file="$file"; }
            [ "$status" = "0" ] || break
          done
          if [ "$status" = "0" ]; then
            # The step-2 verification file must not merely execute: its returned verdicts must be
            # clean. Any unexpected (stop), ABSENT, DISABLED or MISSING verdict fails this step too,
            # so a passing step means the objects, the row-level security, the privileges and the
            # service-role grants are what the rollout plan claims.
            psql -v ON_ERROR_STOP=1 -c 'grant all on all tables in schema public to service_role; grant execute on all functions in schema public to service_role;' >> "$log" 2>&1 || { status=1; failing_file='verification prerequisites (service_role grants)'; }
            psql -v ON_ERROR_STOP=1 -t -A -f docs/lawpay-step2-verification-readonly.sql > step2-verdicts.txt 2>>"$log" || { status=1; failing_file='docs/lawpay-step2-verification-readonly.sql'; }
            if [ "$status" = "0" ]; then
              if grep -E '\(stop\)|ABSENT|DISABLED|MISSING' step2-verdicts.txt >> "$log"; then
                echo "The step-2 verification reported a verdict that must stop the rollout." | tee -a "$log"
                grep -E '\(stop\)|ABSENT|DISABLED|MISSING' step2-verdicts.txt | tr '\n' ' ' | cut -c1-700 | while IFS= read -r line; do echo "::error::step-2 verification verdict: ${line}"; done
                status=1
                failing_file='docs/lawpay-step2-verification-readonly.sql (unexpected verdict)'
              else
                echo "The step-2 verification verdicts are clean: no (stop), ABSENT, DISABLED or MISSING." | tee -a "$log"
              fi
            fi
            # V324: a mapping change must never be raced by a re-resolution. Session B deactivates the
            # mapping and holds that row lock; session A's re-resolution waits on the lock, then must
            # refuse and write nothing, so no transaction can be named under a stale mapping.
            psql -q -c "delete from public.lawpay_transactions where account_id='v324-race-acct';" -c "delete from public.mio_lawpay_accounts where provider_account_id='v324-race-acct';" >> "$log" 2>&1 || { status=1; failing_file='V324 race fixture reset'; }
            psql -q -c "insert into public.lawpay_transactions(gateway_transaction_id,transaction_type,status,account_id,account_key,amount_cents,amount_refunded_cents,currency,occurred_at,reference,payer_name,payment_method_type,last_four,raw) values ('v324-race-a1','CHARGE','COMPLETED','v324-race-acct','',42000,0,'USD','2026-09-20T10:00:00Z','v324-race-r1','V324 Race Payer','eCheck','4242','{}'),('v324-race-a2','CHARGE','COMPLETED','v324-race-acct','',42000,0,'USD','2026-09-21T10:00:00Z','v324-race-r2','V324 Race Payer','eCheck','4242','{}'),('v324-race-a3','CHARGE','COMPLETED','v324-race-acct','',42000,0,'USD','2026-09-22T10:00:00Z','v324-race-r3','V324 Race Payer','eCheck','4242','{}') on conflict (gateway_transaction_id) do nothing;" >> "$log" 2>&1 || { status=1; failing_file='V324 race fixture'; }
            psql -q -t -A -c "select public.mio_map_lawpay_account_v323(jsonb_build_object('provider_account_id','v324-race-acct','account_key','trust','bank_account_id','','bank_role','trust','label','LawPay trust settlement account','last4','Race','is_active',true),'race-setup@firm');" >> "$log" 2>&1 || { status=1; failing_file='V324 race mapping'; }
            if [ "$status" = "0" ]; then
              # Phase 1: session B deactivates the mapping and holds the row lock while it stays open.
              psql -t -A -c "begin; select public.mio_map_lawpay_account_v323(jsonb_build_object('provider_account_id','v324-race-acct','account_key','trust','is_active',false),'race-session-b@firm'); select pg_advisory_xact_lock(324324); select pg_sleep(8); commit;" > race-b1.txt 2>&1 &
              race_b1=$!
              announced=0
              for i in $(seq 1 40); do
                if [ "$(psql -t -A -c "select count(*) from pg_locks where locktype='advisory' and granted and objid=324324;")" = "1" ]; then announced=1; break; fi
                sleep 0.25
              done
              [ "$announced" = "1" ] || { echo "race: session B never held its open transaction" >> "$log"; status=1; failing_file='V324 concurrency announce'; }
              psql -t -A -c "select public.mio_reresolve_lawpay_accounts_v324('v324-race-acct','trust','race-session-a@firm');" > race-a1.txt 2>&1 &
              race_a1=$!
              waited=0
              for i in $(seq 1 40); do
                if [ "$(psql -t -A -c "select count(*) from pg_locks where not granted and locktype='transactionid';")" != "0" ]; then waited=1; break; fi
                sleep 0.25
              done
              [ "$waited" = "1" ] || { echo "race: the re-resolution never waited on the mapping row lock" >> "$log"; status=1; failing_file='V324 concurrency wait'; }
              wait "$race_a1" || status=1
              wait "$race_b1" || status=1
              cat race-b1.txt race-a1.txt | tee -a "$log"
              grep -q '"ok": false' race-a1.txt || { echo "race: a re-resolution must refuse a mapping deactivated before it locked" >> "$log"; status=1; failing_file='V324 concurrency refusal'; }
              grep -q '"updated": 0' race-a1.txt || { echo "race: a refused re-resolution must update zero rows" >> "$log"; status=1; failing_file='V324 concurrency refusal'; }
              active_after="$(psql -t -A -c "select count(*) from public.mio_lawpay_accounts where provider_account_id='v324-race-acct' and is_active;")"
              named_after="$(psql -t -A -c "select count(*) from public.lawpay_transactions where account_id='v324-race-acct' and coalesce(account_key,'') <> '';")"
              echo "race: phase 1 active_mappings=$active_after named_transactions=$named_after" | tee -a "$log"
              [ "$active_after" = "0" ] || { echo "session B's deactivation must have committed before the refusal" >> "$log"; status=1; failing_file='V324 concurrency deactivation'; }
              [ "$named_after" = "0" ] || { echo "a refused re-resolution must leave every row unresolved" >> "$log"; status=1; failing_file='V324 concurrency refusal'; }
              psql -t -A -c "select 'V324 concurrency: a stale mapping is refused and nothing is written' as result;" | tee -a "$log"
            fi
            if [ "$status" = "0" ]; then
              # Phase 2: session A resolves inside an open transaction, so the row lock is held through
              # the update; session B's re-save of the same active mapping must wait for it to commit.
              psql -q -t -A -c "select public.mio_map_lawpay_account_v323(jsonb_build_object('provider_account_id','v324-race-acct','account_key','trust','bank_account_id','','bank_role','trust','label','LawPay trust settlement account','last4','Race','is_active',true),'race-setup@firm');" >> "$log" 2>&1 || { status=1; failing_file='V324 race reactivation'; }
              psql -t -A -c "begin; select pg_advisory_xact_lock(324325); select public.mio_reresolve_lawpay_accounts_v324('v324-race-acct','trust','race-session-a@firm'); select pg_sleep(8); commit;" > race-a2.txt 2>&1 &
              race_a2=$!
              announced=0
              for i in $(seq 1 40); do
                if [ "$(psql -t -A -c "select count(*) from pg_locks where locktype='advisory' and granted and objid=324325;")" = "1" ]; then announced=1; break; fi
                sleep 0.25
              done
              [ "$announced" = "1" ] || { echo "race: session A never held its open transaction" >> "$log"; status=1; failing_file='V324 concurrency announce'; }
              psql -t -A -c "begin; select public.mio_map_lawpay_account_v323(jsonb_build_object('provider_account_id','v324-race-acct','account_key','trust','bank_account_id','','bank_role','trust','label','LawPay trust settlement account','last4','Race','is_active',true),'race-session-b@firm'); select pg_sleep(8); commit;" > race-b2.txt 2>&1 &
              race_b2=$!
              waited=0
              for i in $(seq 1 40); do
                if [ "$(psql -t -A -c "select count(*) from pg_locks where not granted and locktype='transactionid';")" != "0" ]; then waited=1; break; fi
                sleep 0.25
              done
              [ "$waited" = "1" ] || { echo "race: the mapping change never waited on the row lock held through the update" >> "$log"; status=1; failing_file='V324 concurrency wait'; }
              wait "$race_a2" || status=1
              wait "$race_b2" || status=1
              cat race-a2.txt race-b2.txt | tee -a "$log"
              grep -q '"ok": true' race-a2.txt || { echo "race: the authorized re-resolution must succeed" >> "$log"; status=1; failing_file='V324 concurrency authorized write'; }
              grep -q '"updated": 3' race-a2.txt || { echo "race: the authorized re-resolution must name the three race rows" >> "$log"; status=1; failing_file='V324 concurrency authorized write'; }
              psql -v ON_ERROR_STOP=1 -f tests/sql/lawpay-provider-account-resolution-v324-concurrency.sql >> "$log" 2>&1 || { status=1; failing_file='tests/sql/lawpay-provider-account-resolution-v324-concurrency.sql'; }
              psql -t -A -c "select 'V324 concurrency: the mapping change waits for the lock held through the update' as result;" | tee -a "$log"
            fi

            # Two overlapping sessions posting the same provider transaction: exactly one may post,
            # and a trust posting must leave exactly one ledger entry.
            psql -t -A -c "begin; select public.mio_post_lawpay_classification_v323(jsonb_build_object('gateway_transaction_id','lawpay-refunded-charge','ownership','matter','matter_id','matter-south','actual_account_key','trust','account_source','reported_by_lawpay','category','trust_deposit'),'ben@firm')->>'status'; select pg_sleep(1); commit;" > race-a.txt &
            race_a=$!
            sleep 0.25
            psql -t -A -c "begin; select public.mio_post_lawpay_classification_v323(jsonb_build_object('gateway_transaction_id','lawpay-refunded-charge','ownership','matter','matter_id','matter-south','actual_account_key','trust','account_source','reported_by_lawpay','category','trust_deposit'),'ben@firm')->>'status'; commit;" > race-b.txt &
            race_b=$!
            wait "$race_a" || status=1
            wait "$race_b" || status=1
            cat race-a.txt race-b.txt | tee -a "$log"
            if [ "$(grep -c '^posted$' race-a.txt race-b.txt | awk -F: '{s+=$2} END {print s}')" != "1" ]; then
              echo "race: expected exactly one posted status" >> "$log"; status=1
            fi
            posted="$(psql -t -A -c "select count(*) from public.mio_lawpay_classifications where identity='lawpay-refunded-charge' and posting_status='posted';")"
            entries="$(psql -t -A -c "select count(*) from public.mio_lawpay_ledger_entries where identity='lawpay-refunded-charge';")"
            echo "race: posted=$posted ledger_entries=$entries" | tee -a "$log"
            [ "$posted" = "1" ] || { echo "expected one posted classification" >> "$log"; status=1; failing_file="concurrency race"; }
            [ "$entries" = "1" ] || { echo "expected one ledger entry" >> "$log"; status=1; failing_file="concurrency race"; }
            psql -t -A -c "select 'V323 concurrency: one posting, one ledger entry' as result;" | tee -a "$log"
          fi
          # The full output also travels with the run's artifacts, for anyone with repository access.
          mkdir -p finance-test-results && cp "$log" finance-test-results/lawpay-database-suite.log
          if [ "$status" != "0" ]; then summary; exit 1; fi
      - run: npm run build
      - run: node node_modules/playwright-core/cli.js install chromium --with-deps
      - name: Test real production bundle with intercepted synthetic services
        run: timeout 180s node tests/finance-v314-browser.mjs
      - name: Withdrawal rows must agree with Bulk billing trust and graph every matter
        run: timeout 180s node tests/withdrawal-finance-parity-browser.mjs
      - name: The central LawPay review queue must classify, record and match LawPay payments in the real bundle
        run: timeout 240s node tests/lawpay-classification-v323-browser.mjs
      - name: The consolidated LawPay review notification must count, open the queue and stay zero-safe
        run: timeout 240s node tests/lawpay-review-notification-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-verification
          path: finance-test-results
          retention-days: 5
