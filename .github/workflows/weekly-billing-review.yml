name: Weekly Billing Review Safety Checks
on:
  pull_request:
    paths:
      - 'src/MioWeeklyBilling.jsx'
      - 'src/mioWeeklyBillingModel.js'
      - 'mio-weekly-billing-review-mount.js'
      - 'tests/weekly-billing-review.test.js'
      - 'vite.config.js'
      - '.github/workflows/weekly-billing-review.yml'
  push:
    branches:
      - 'feature/weekly-billing-review-v1'
permissions:
  contents: read
jobs:
  weekly-billing-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Weekly billing decision engine tests
        run: node --test tests/weekly-billing-review.test.js
      - name: Production build syntax check
        run: npm run build
