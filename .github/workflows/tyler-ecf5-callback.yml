name: Tyler ECF5 callback tests
on:
  pull_request:
    paths:
      - 'lib/efiling/**'
      - 'scripts/emit_tyler_ecf5_fixture.mjs'
      - 'scripts/validate_tyler_ecf5.py'
      - 'tests/tyler_ecf5_schema_validation_test.py'
      - 'src/efiling/**'
      - 'mio-v326-efiling-mount.js'
      - 'supabase/migrations/*tyler_efiling*'
      - 'tests/tyler-*.test.js'
      - '.github/workflows/tyler-ecf5-callback.yml'
  push:
    branches: [feat/tyler-ecf5-extension-validation]
    paths:
      - 'lib/efiling/**'
      - 'tests/tyler-*.test.js'
      - '.github/workflows/tyler-ecf5-callback.yml'
permissions:
  contents: read
jobs:
  callback-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/tyler-efm-callback.test.js tests/tyler-ecf5-nfrc-contract.test.js tests/tyler-efiling-receipts.test.js tests/tyler-efiling-cloud-history.test.js tests/tyler-outbound-pipeline.test.js tests/tyler-efiling-outbox.test.js tests/tyler-reviewfiling-response.test.js tests/tyler-ecf5-reviewfiling-envelope.test.js tests/tyler-ecf5-subsequent-civil-mapper.test.js tests/tyler-ecf5-document-rendition.test.js tests/tyler-ecf5-existing-case-message.test.js
      - run: python3 -m pip install --disable-pip-version-check lxml==6.0.2
      - run: python3 -m unittest discover -s tests -p 'tyler_ecf5_schema_validation_test.py' -v
      - run: node scripts/emit_tyler_ecf5_fixture.mjs ./synthetic-efm-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-tyler-xml
          path: synthetic-efm-artifacts/*.xml
          retention-days: 1
      - run: npm run build
