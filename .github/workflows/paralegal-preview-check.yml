name: Paralegal preview checks
on:
  push:
    branches: [feature/paralegal-need-to-set-foundation-20260917]
  pull_request:
    paths:
      - 'src/paralegal/**'
      - 'tests/paralegal*'
      - '.github/workflows/paralegal-preview-check.yml'
permissions:
  contents: read
concurrency:
  group: paralegal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Need to Set integration points (source code only)
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const text=readFileSync('src/App.jsx','utf8');
          for(const token of ['caseMioNeedToSetStepData','needToSetRows','needToSetSteps','needToSetActivities','caseMioSettingWorkspaces']){
            const at=text.indexOf(token);
            console.log('\nSOURCE EXCERPT: '+token+'\n'+(at<0?'Not found':text.slice(Math.max(0,at-600),at+1800)));
          }
          NODE
      - name: Run focused tests when present
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const tests=readdirSync('tests').filter(f=>/^paralegal.*\.test\.mjs$/.test(f)).map(f=>'tests/'+f);
          if(!tests.length){console.log('Foundation tests not committed yet.');process.exit(0)}
          const result=spawnSync(process.execPath,['--test',...tests],{stdio:'inherit'});
          process.exit(result.status??1);
          NODE
