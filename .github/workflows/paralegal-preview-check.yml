name: Paralegal preview checks
on:
  push:
    branches: [feature/paralegal-need-to-set-foundation-20260917]
    paths:
      - 'src/paralegal/**'
      - 'tests/paralegal*'
      - 'src/main.jsx'
      - 'api/paralegal.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/paralegal-preview-check.yml'
  pull_request:
    paths:
      - 'src/paralegal/**'
      - 'tests/paralegal*'
      - '.github/workflows/paralegal-preview-check.yml'
permissions:
  contents: read
concurrency:
  group: paralegal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source for Paralegal integration inspection
        uses: actions/upload-artifact@v4
        with:
          name: paralegal-source
          retention-days: 1
          include-hidden-files: false
          path: |
            src/
            api/
            lib/
            tests/
            package.json
            package-lock.json
            vite.config.js
            vercel.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check controller syntax
        run: node --check src/paralegal/need-to-set-controller.mjs
      - name: Require all Paralegal behavior tests
        run: node --test tests/paralegal*.test.mjs
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Verify the application still builds
        run: npm run build
