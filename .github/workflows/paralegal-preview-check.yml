name: Paralegal preview checks
on:
  push:
    branches: [feature/paralegal-port-20261101]
    paths:
      - 'src/paralegal/**'
      - 'lib/paralegal/**'
      - 'tests/paralegal*'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'api/paralegal.js'
      - 'api/paralegal/**'
      - 'api/microsoft/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/paralegal-preview-check.yml'
  pull_request:
    paths:
      - 'src/paralegal/**'
      - 'lib/paralegal/**'
      - 'tests/paralegal*'
      - 'src/App.jsx'
      - 'api/paralegal.js'
      - 'api/paralegal/**'
      - 'api/microsoft/**'
concurrency:
  group: paralegal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Check Paralegal server modules
        run: |
          node --check src/paralegal/need-to-set-controller.mjs
          node --check src/paralegal/need-to-set-snapshot.js
          node --check src/paralegal/paralegal-client.js
          node --check lib/paralegal/auth.js
          node --check lib/paralegal/claude.js
          node --check api/paralegal.js
          node --check lib/paralegal/microsoft/oauth.js
          node --check lib/paralegal/microsoft/graph.js
          node --check lib/paralegal/microsoft/state.js
          node --check lib/paralegal/microsoft/tokenStore.js
          node --check api/microsoft/oauth-start.js
          node --check api/microsoft/callback.js
          node --check api/microsoft/status.js
          node --check lib/paralegal/reviews.js
          node --check lib/paralegal/emailCompose.js
          node --check lib/paralegal/microsoft/sync.js
          node --check lib/paralegal/microsoft/syncState.js
          node --check api/microsoft/sync.js
          node --check api/paralegal/calendar-actions.js
          node --check api/paralegal/email-actions.js
      - name: Require all Paralegal behavior tests
        run: node --test tests/paralegal*.test.mjs
      - name: Verify the application still builds
        run: npm run build

