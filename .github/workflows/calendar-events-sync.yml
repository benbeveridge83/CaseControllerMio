name: Notification-of-service calendar events reach every window
on:
  push:
    branches: [fix/notification-service-calendar-sync, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit regressions for calendar events and cloud refresh pacing
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --test tests/*.test.js | tee test-results/unit-regressions.log
      - name: Build production application and validate emitted syntax
        run: npm run build
      - name: Install test browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser verification with synthetic accounts only
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/mio-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/calendar-events-browser.mjs | tee test-results/calendar-events-browser.log
          node tests/cloud-tabs-browser.mjs | tee test-results/cloud-tabs-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mio-calendar-events-sync
          retention-days: 3
          path: |
            test-results
            dist
