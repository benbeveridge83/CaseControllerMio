name: Daily trust fix verification
on:
  push:
    branches: [fix/daily-trust-lawpay-refresh-20260911]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/daily-billing-finance-refresh.test.js tests/pnc-daily-trust.test.js
      - run: npm run build
