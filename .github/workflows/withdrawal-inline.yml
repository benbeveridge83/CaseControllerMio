name: Inline withdrawal workspace
on:
  push:
    branches: [main, feature/withdrawal-inline-v304, fix/withdrawal-simple-complete-v3042, fix/withdrawal-flow-v3044]
  pull_request:
    branches: [main]
    paths: ['src/**', 'mio-v304-*', 'mio-v3042-*', 'mio-v3043-*', 'mio-v3044-*', 'tests/**', 'vite.config.js', '.github/workflows/withdrawal-inline.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture reproducible source without credentials or case data
        run: |
          mkdir -p test-results
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude='.env*' -czf test-results/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: withdrawal-source
          retention-days: 1
          path: test-results/source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
      - run: npm install --no-save jszip@3.10.1
      - name: Capture isolated UI runtime
        run: |
          folders="dist"
          for name in playwright-core jszip pako lie immediate readable-stream safe-buffer setimmediate inherits util-deprecate string_decoder process-nextick-args core-util-is isarray; do
            if [ -d "node_modules/$name" ]; then folders="$folders node_modules/$name"; fi
          done
          tar -czf test-results/browser-runtime.tar.gz $folders
      - uses: actions/upload-artifact@v4
        with:
          name: withdrawal-browser-runtime
          retention-days: 1
          path: test-results/browser-runtime.tar.gz
      - name: Browser regression checks
        run: |
          npx playwright-core install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > test-results/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 180 node tests/withdrawal-inline-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: withdrawal-inline-results
          retention-days: 3
          path: test-results
