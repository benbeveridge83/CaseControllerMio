name: Google Ads removed conversion guard
on:
  push:
    branches: [fix/google-ads-removed-conversions-v315]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test removed conversion safeguards
        run: node --test tests/google-ads-removed-conversions.test.js
      - name: Build production bundle
        run: npm run build
