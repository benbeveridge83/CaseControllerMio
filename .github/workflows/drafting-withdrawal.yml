name: Drafting and withdrawal verification
on:
  push:
    branches: [feature/drafting-withdrawal-20260905]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture source for reproducible verification
        run: |
          mkdir -p test-results
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude='.env*' -czf test-results/source.tar.gz .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
      - run: npm install --no-save jszip@3.10.1
      - run: npx playwright-core install --with-deps chromium
      - name: Browser checks with synthetic data and intercepted external requests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mio-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/cloud-browser.mjs
          node tests/drafting-withdrawal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mio-drafting-withdrawal-verification
          retention-days: 3
          path: test-results
