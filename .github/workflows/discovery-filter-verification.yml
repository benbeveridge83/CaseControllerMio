name: Discovery and persistent filter verification
on:
  push:
    branches: [fix/discovery-persistent-filters]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full production build
        run: npm run build
      - name: Regression tests
        run: node --test tests/*.test.js
      - name: Export verification dependencies
        if: always()
        run: tar -czf verification-deps.tgz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-filter-verification
          path: |
            verification-deps.tgz
            dist
          retention-days: 2
