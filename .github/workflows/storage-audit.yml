name: Mio storage audit
on:
  push:
    branches: [fix/cloud-persistence-audit-20260905]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory application persistence without accessing user data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('src/App.jsx', 'utf8');
          const lines = text.split('\n');
          const print = (a,b) => lines.slice(Math.max(0,a),b).forEach((l,i)=>console.log(`${Math.max(0,a)+i+1}: ${l.slice(0,3000)}`));
          console.log('=== PERSISTENCE FUNCTION DEFINITIONS ===');
          const re = /(?:async\s+)?function\s+\w*(?:MioState|CloudState|LocalStorage|Hydrat|Persist|StorageCache)\w*\s*\(/i;
          lines.forEach((line,i)=>{if(re.test(line)) {console.log(`\n=== ${i+1} ===`); print(i,i+100);}});
          console.log('=== APPLICATION STORAGE CALL SITES ===');
          lines.forEach((l,i)=>{if(l.length < 5000 && /localStorage\.(setItem|removeItem)|sessionStorage\.(setItem|removeItem)|indexedDB\.open/.test(l)) console.log(`${i+1}: ${l.slice(0,1500)}`);});
          console.log('=== STORAGE KEY INVENTORY (SOURCE CODE ONLY) ===');
          console.log([...new Set([...text.matchAll(/['"`]((?:caseMio|mio_)[^'"`\r\n]{1,160})['"`]/g)].map(m=>m[1]))].sort().join('\n'));
          console.log('=== CLOUD STATE REFERENCES ===');
          lines.forEach((l,i)=>{if(l.length < 5000 && /\.from\(['"][^'"]*(?:state|setting|preference)|mioState|cloudState|mioCloud/i.test(l)) console.log(`${i+1}: ${l.slice(0,1500)}`);});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mio-source-for-storage-audit
          retention-days: 1
          path: |
            src/App.jsx
            src/main.jsx
            src/supabaseClient.js
            src/storageSafety.js
            vite.config.js
            package.json
            package-lock.json
            mio-v*.js
