name: Processes V314 verification
on:
  push:
    branches: [feature/process-builder-v314]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Inspect integration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text().splitlines()
          terms=['function canOpenPage','function billingEntryToRelationalRow','function billingEntryFrom','function defaultBilling','function currentTeamMember','function currentUserMember',"id: 'workflow'","key: 'workflow'",'href="#workflow"','function pageFrom','function setPage','function graphFetch']
          for term in terms:
            hits=[i for i,l in enumerate(s) if term in l][:2]
            print('\nTERM',term,'HITS',hits)
            for i in hits: print('\n'.join(str(j+1)+': '+s[j][:600] for j in range(max(0,i-2),min(len(s),i+40))))
          print('\nDECLARATIONS')
          print('\n'.join(str(i+1)+': '+l[:220] for i,l in enumerate(s) if ('function ' in l and any(w in l.lower() for w in ['billing','rate','member','page'])) or ('workflow' in l and any(w in l for w in ['pages','Pages','PAGES','label:',"'Workflow'"]))))
          print('\nSAVE BILLING\n'+'\n'.join(str(j+1)+': '+s[j] for j in range(41422,41504)))
          PY
      - run: npm ci
      - run: npm run build
      - name: Existing regressions and process tests
        run: |
          node --test tests/workflow-blocks.test.js tests/withdrawal-workflow.test.js tests/cloud-storage.test.js tests/cloud-conflict.test.js tests/pnc-daily-trust.test.js
          if [ -f tests/process-model.test.js ]; then node --test tests/process*.test.js; fi
      - name: Browser verification
        if: hashFiles('scripts/test-processes-browser.mjs') != ''
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/test-processes-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processes-verification
          path: process-test-results
          retention-days: 2
