name: Processes V314 verification
on:
  push:
    branches: [feature/process-builder-v314]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: process-test-only
          POSTGRES_DB: process_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: process-test-only
      PGDATABASE: process_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Materialize verified source transfer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,json
          root=Path('.processes-v314')
          if root.exists():
            data=b''.join((root/('part-'+str(i))).read_bytes() for i in range(1,5))
            assert hashlib.sha256(data).hexdigest()=='1a80859ee9495311166ae07a989b8f9000bd4dea3e87a23f55b3b69ea136cbe0','Source transfer checksum mismatch'
            files=json.loads(lzma.decompress(data))
            allowed={'scripts/test-processes-browser.mjs','scripts/apply-processes-integration.mjs','scripts/processes-db-fixture.sql','scripts/test-processes-db.sql','supabase/migrations/20260910230000_processes_v314.sql','mio-v314-processes.js'}
            for name,text in files.items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith('src/processes/') or (name.startswith('tests/process-') and name.endswith('.test.js')),name
              if not p.exists():
                p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
            print('Source transfer validated:',len(files),'files. Existing reviewed corrections preserved.')
          PY
          node scripts/apply-processes-integration.mjs
          node scripts/harden-processes-v314.mjs
      - run: npm ci
      - run: npm run build
      - name: Process and existing regression tests
        run: |
          node --test --test-reporter=spec tests/process*.test.js tests/workflow-blocks.test.js tests/withdrawal-workflow.test.js tests/cloud-storage.test.js tests/cloud-conflict.test.js tests/pnc-daily-trust.test.js
          node scripts/test-withdrawal-release.mjs
      - name: Isolated database transaction and permission verification
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/processes-db-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260910230000_processes_v314.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-processes-db.sql
      - name: Production bundle browser verification
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/test-processes-browser.mjs
      - name: Commit only verified source to feature branch
        if: github.ref == 'refs/heads/feature/process-builder-v314'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/processes tests/process*.test.js scripts/*process*.mjs scripts/*process*.sql scripts/test-withdrawal-release.mjs supabase/migrations/20260910230000_processes_v314.sql mio-v314-processes.js vite.config.js
          if [ -d .processes-v314 ]; then git rm -r .processes-v314; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish verified drag-and-drop Processes workspace and atomic billing'
            git push origin HEAD:feature/process-builder-v314
          fi
          git log -1 --format='%H %s'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processes-verification
          path: process-test-results
          retention-days: 3
