name: PNC and daily trust verification
on:
  push:
    branches: [feature/pnc-daily-trust-v313]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export source for isolated verification
        run: git archive --format=tar HEAD > /tmp/mio-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: mio-source-verification
          path: /tmp/mio-source.tar
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: PNC and existing regression tests
        run: |
          node --test tests/pnc-daily-trust.test.js
          node scripts/test-native-discovery-filters.mjs
          node scripts/test-withdrawal-release.mjs
          node --test tests/cloud-storage.test.js tests/cloud-conflict.test.js tests/workflow-blocks.test.js tests/withdrawal-workflow.test.js
      - name: Browser verification
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/test-pnc-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnc-browser-verification
          path: pnc-test-results
          retention-days: 2
