name: Replenishment logic checks
on:
  push:
    paths:
      - 'src/mioReplenishmentClaims.js'
      - 'src/mioFinanceReview.js'
      - 'src/mioTrustReplenishmentCalculations.js'
      - 'src/mioTrustReplenishmentWorkflow.js'
      - 'src/mioReplenishmentSafety.js'
      - 'src/mioStandaloneReplenishmentData.js'
      - 'tests/mioReplenishmentClaims.test.mjs'
      - 'tests/mioFinanceReplenishmentPlan.test.mjs'
      - 'tests/mioTrustReplenishmentCalculations.test.mjs'
      - 'tests/mioTrustReplenishmentWorkflow.test.mjs'
      - 'tests/mioReplenishmentSafety.test.mjs'
      - '.github/workflows/replenishment-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mioReplenishmentClaims.test.mjs tests/mioFinanceReplenishmentPlan.test.mjs tests/mioTrustReplenishmentCalculations.test.mjs tests/mioTrustReplenishmentWorkflow.test.mjs tests/mioReplenishmentSafety.test.mjs
